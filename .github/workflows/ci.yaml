name: push
on: [push]
jobs:
  build:
    name: Build and upload ROM
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - run: make
      - run: |
          mv spindown.gba spindown-${{ github.ref_name }}.gba
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: spindown
          path: spindown-${{ github.ref_name }}.gba


  release:
    name: Upload ROM to Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download
        uses: actions/download-artifact@v7
        with:
          name: spindown
      - name: upload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} spindown-${{ github.ref_name }}.gba --clobber
